<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Task Manager</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --card-2: #eef4ff;
        --primary: #4c6fff;
        --primary-dark: #2d4ed8;
        --accent: #17b26a;
        --danger: #ef4444;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 14px 30px rgba(16, 24, 40, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #edf3ff 0%, #f9fafb 100%);
        color: var(--text);
      }

      .container {
        max-width: 900px;
        margin: 50px auto;
        padding: 24px;
      }

      .app {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary) 0%, #7a5cff 100%);
        color: white;
        padding: 28px 28px 20px;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }

      .date-pill {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 14px;
        margin-top: 22px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 16px;
      }

      .stat-label {
        display: block;
        font-size: 0.75rem;
        opacity: 0.9;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .stat-value {
        display: block;
        margin-top: 8px;
        font-size: 1.8rem;
        font-weight: 700;
      }

      .content {
        padding: 28px;
      }

      .task-form {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        margin-bottom: 22px;
      }

      input[type='text'],
      select {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        font-size: 1rem;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type='text']:focus,
      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(76, 111, 255, 0.12);
      }

      .btn {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 0.96rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, filter 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.02);
      }

      .btn-primary {
        background: var(--primary);
        color: white;
      }

      .btn-secondary {
        background: #eef2ff;
        color: var(--primary-dark);
      }

      .btn-danger {
        background: #fee2e2;
        color: var(--danger);
      }

      .task-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .task-item {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        transition: all 0.2s ease;
      }

      .task-item:hover {
        box-shadow: 0 6px 20px rgba(17, 24, 39, 0.05);
      }

      .task-item.completed {
        background: #f0fdf4;
        border-color: #bbf7d0;
      }

      .task-checkbox {
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .task-main {
        min-width: 0;
      }

      .task-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        word-break: break-word;
      }

      .task-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .task-item.completed .task-title {
        text-decoration: line-through;
        color: var(--muted);
      }

      .task-tag {
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .tag-low {
        background: #e0f2fe;
        color: #0369a1;
      }

      .tag-medium {
        background: #fef3c7;
        color: #92400e;
      }

      .tag-high {
        background: #fee2e2;
        color: #b91c1c;
      }

      .delete-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 6px 8px;
        border-radius: 8px;
      }

      .delete-btn:hover {
        background: #fef2f2;
        color: var(--danger);
      }

      .empty-state {
        text-align: center;
        padding: 30px 20px;
        border: 1px dashed var(--border);
        border-radius: 14px;
        background: #fafbff;
        color: var(--muted);
      }

      @media (max-width: 720px) {
        .task-form {
          grid-template-columns: 1fr;
        }

        .task-item {
          grid-template-columns: auto 1fr auto;
        }

        .task-item .delete-btn {
          grid-column: 2 / 4;
          justify-self: end;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="app">
        <header class="header">
          <div class="top-row">
            <div class="title-wrap">
              <h1>Daily Task Manager</h1>
            </div>
            <div class="date-pill" id="todayDate"></div>
          </div>

          <div class="stats">
            <div class="stat-card">
              <span class="stat-label">Total</span>
              <span class="stat-value" id="totalTasks">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Done</span>
              <span class="stat-value" id="doneTasks">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Pending</span>
              <span class="stat-value" id="pendingTasks">0</span>
            </div>
          </div>
        </header>

        <main class="content">
          <form class="task-form" id="taskForm">
            <input id="taskInput" type="text" placeholder="Add your task here..." maxlength="100" required />
            <select id="prioritySelect" aria-label="Priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
            <button type="submit" class="btn btn-primary">Add Task</button>
          </form>

          <button type="button" class="btn btn-secondary" id="clearCompletedBtn" style="margin-bottom: 18px;">
            Clear Completed
          </button>

          <ul class="task-list" id="taskList" aria-live="polite"></ul>
        </main>
      </div>
    </div>

    <script>
      const taskForm = document.getElementById('taskForm');
      const taskInput = document.getElementById('taskInput');
      const prioritySelect = document.getElementById('prioritySelect');
      const taskList = document.getElementById('taskList');
      const totalTasksEl = document.getElementById('totalTasks');
      const doneTasksEl = document.getElementById('doneTasks');
      const pendingTasksEl = document.getElementById('pendingTasks');
      const clearCompletedBtn = document.getElementById('clearCompletedBtn');
      const todayDate = document.getElementById('todayDate');

      const STORAGE_KEY = 'daily-task-manager-tasks';

      function getTasks() {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      }

      function saveTasks(tasks) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });
      }

      function updateDate() {
        const now = new Date();
        todayDate.textContent = now.toLocaleDateString(undefined, {
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });
      }

      function renderTasks() {
        const tasks = getTasks();

        if (tasks.length === 0) {
          taskList.innerHTML = `
            <li class="empty-state">
              No tasks yet. Add one to start your day.
            </li>
          `;
        } else {
          taskList.innerHTML = tasks
            .map(
              (task) => `
                <li class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                  <input
                    class="task-checkbox"
                    type="checkbox"
                    ${task.completed ? 'checked' : ''}
                    aria-label="Mark task as complete"
                  />
                  <div class="task-main">
                    <p class="task-title">${task.title}</p>
                    <div class="task-meta">
                      <span class="task-tag tag-${task.priority.toLowerCase()}">${task.priority}</span>
                      <span>Created ${formatDate(task.createdAt)}</span>
                    </div>
                  </div>
                  <button class="btn btn-danger" type="button">Delete</button>
                </li>
              `
            )
            .join('');
        }

        const total = tasks.length;
        const done = tasks.filter((task) => task.completed).length;
        const pending = total - done;

        totalTasksEl.textContent = total;
        doneTasksEl.textContent = done;
        pendingTasksEl.textContent = pending;
      }

      function addTask(event) {
        event.preventDefault();

        const title = taskInput.value.trim();
        const priority = prioritySelect.value;

        if (!title) {
          taskInput.focus();
          return;
        }

        const tasks = getTasks();
        tasks.unshift({
          id: Date.now().toString(),
          title,
          priority,
          completed: false,
          createdAt: new Date().toISOString()
        });

        saveTasks(tasks);
        taskForm.reset();
        prioritySelect.value = 'Medium';
        taskInput.focus();
        renderTasks();
      }

      function toggleTask(id) {
        const tasks = getTasks().map((task) =>
          task.id === id ? { ...task, completed: !task.completed } : task
        );
        saveTasks(tasks);
        renderTasks();
      }

      function deleteTask(id) {
        const tasks = getTasks().filter((task) => task.id !== id);
        saveTasks(tasks);
        renderTasks();
      }

      function clearCompleted() {
        const tasks = getTasks().filter((task) => !task.completed);
        saveTasks(tasks);
        renderTasks();
      }

      taskForm.addEventListener('submit', addTask);

      taskList.addEventListener('click', (event) => {
        const deleteButton = event.target.closest('.btn-danger');
        const checkbox = event.target.closest('.task-checkbox');

        if (deleteButton) {
          const item = deleteButton.closest('.task-item');
          if (item) deleteTask(item.dataset.id);
          return;
        }

        if (checkbox) {
          const item = checkbox.closest('.task-item');
          if (item) toggleTask(item.dataset.id);
        }
      });

      clearCompletedBtn.addEventListener('click', clearCompleted);

      updateDate();
      renderTasks();
    </script>
  </body>
</html>
